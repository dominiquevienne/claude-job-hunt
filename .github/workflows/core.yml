# The parsing core, on the three systems the README promises — and nothing else.
#
# **Sixty-one adapters depend on third-party sites. Testing them here would
# mean sweeping the web on every commit**, which is precisely what this project
# teaches people not to do. So this runs `tests/`, which touches no network.
#
# **What it is for is the promise, not the coverage.** `README.md` says Windows,
# Linux and macOS; until now nothing tried any of them but the developer's
# macOS. Issue #108.
name: core

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} · python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor, and it is measured rather than chosen: it is the
        # oldest version that runs this code, set by `str.removeprefix` in
        # bin/host-drift.py. See CONTRIBUTING.md.
        #
        # **That measurement was taken on `bin/` and not on `tests/`**, and
        # the three 3.9 cells were red from the first run because
        # `tests/test_core.py` used `sys.stdlib_module_names`, which is 3.10+.
        # The floor is a promise in README.md, so the test was changed rather
        # than the promise — a published promise is not raised to make a check
        # pass. Re-measured across every tracked `.py` on 2026-09-04: the only
        # version-bearing calls left are `removeprefix`/`removesuffix`, and
        # the floor is 3.9 in fact and not only in this comment. #143.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
        # **`ubuntu-latest` rolled to 26.04 and `setup-python` has no 3.9 build
        # for it.** Verbatim, run 45059657047 on 2026-11-22: `The version
        # '3.9' with architecture 'x64' was not found for Ubuntu 26.04`. The
        # promise is NOT raised to make this pass -- see the comment above:
        # the floor is 3.9 because `str.removeprefix` binds it, measured on
        # the code and not chosen. So the 3.9 cell is pinned to an image that
        # still carries it. Measured in the setup-python manifest on
        # 2026-11-23: 3.9.25 on 22.04 AND on 24.04, ABSENT on 26.04 -- 24.04
        # is the newer of the two, so it defers the question longest.
        # **3.12 stays on the rolling image on purpose**: it is what catches
        # the next roll, and pinning it too would make the drift invisible.
        # ubuntu-24.04 will lose 3.9 in its turn, exactly as 26.04 just did,
        # and THAT day the question is a product one and not a CI one. #1334.
        exclude:
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-24.04
            python: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: The core parses the same way everywhere
        run: python -m unittest discover -s tests -v

  shell-scripts:
    # **The `.gitattributes` guard, checked rather than assumed.** A CRLF
    # checkout makes `bin/doctor.sh` fail with `bash\r`, and that error names
    # an interpreter that exists. Issue #107 could not be reproduced without a
    # Windows machine; this is the machine.
    name: bin/*.sh survive a Windows checkout
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: No CR in any shell script
        run: |
          if grep -rlU $'\r' bin/*.sh; then
            echo "A shell script arrived with CRLF — .gitattributes did not hold."
            exit 1
          fi
          echo "bin/*.sh are LF after a Windows checkout."
      - name: They parse
        run: for f in bin/*.sh; do bash -n "$f"; done

  every-module-imports:
    # An adapter that does not import cannot be run, and that failure needs no
    # network to find. **It is not a test of the adapter** — it is the floor.
    name: every script imports · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # same roll, same reason as the matrix above: this job hardcodes
        # 3.9, so the whole ubuntu cell moves to the pinned image.
        # windows-latest is untouched -- it carries 3.9 and it passed.
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Compile every script
        run: python -m compileall -q skills bin tests
